apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.firebase.appdistribution"

// Load release signing credentials from key.properties when present (CI writes
// this from a GitHub secret). Falls back to local defaults for dev builds.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file("app/key.properties")
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Short label of the server environment the demo app talks to, read from the
 * monorepo .env (SERVER_ENVIRONMENT) so the launcher name advertises which
 * backend a build points at. Staging is the QA backend, matching the native
 * demo apps. Kept in sync with example/metro.config.js and
 * scripts/sync-app-label.sh.
 */
def serverEnvironmentLabel = {
    def value = System.getenv("SERVER_ENVIRONMENT")
    def envFile = rootProject.file("../../.env")
    if (!value && envFile.exists()) {
        def line = envFile.readLines().find { it.trim().startsWith("SERVER_ENVIRONMENT=") }
        if (line) {
            value = line.substring(line.indexOf("=") + 1).trim().replaceAll('^"|"$', '')
        }
    }
    switch ((value ?: "staging").toLowerCase()) {
        case "development":
            return "DEV"
        case "production":
            return "PROD"
        default:
            return "QA"
    }
}()

/**
 * The apps this example builds, one product flavor each, named like its iOS
 * scheme: its launcher name and its JS entry file (in example/), so each
 * flavor's bundle holds only its app. They share the application ID the access
 * key is bound to, and the signing, so each is delivered like the demo; only
 * the name differs.
 */
def appFlavors = [
    demo: [appName: "AppSDK React Native Demo ${serverEnvironmentLabel}", entryFile: "index.js"],
    showcase: [appName: "Rx Showcase", entryFile: "index.showcase.js"],
]

react {
    // The debug variants are named after the flavors.
    debuggableVariants = appFlavors.keySet().collect { "${it}Debug" }
}

// The React Native plugin bundles one entry file for every variant; a flavor's
// release build bundles its own instead. This callback runs after the plugin's,
// which registers the bundle task. Debug builds load the entry from Metro, see
// JS_MAIN_MODULE.
androidComponents {
    onVariants(selector().all()) { variant ->
        def bundleTask = "createBundle${variant.name.capitalize()}JsAndAssets"
        // Debuggable variants have none.
        if (tasks.names.contains(bundleTask)) {
            def entryFile = rootProject.file("../${appFlavors[variant.flavorName].entryFile}")
            tasks.named(bundleTask) { it.entryFile.set(entryFile) }
        }
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk 36

    namespace "iasdkreactnative.example"
    
    defaultConfig {
        applicationId "de.ihreapotheken.reactnative"
        minSdkVersion 30
        targetSdkVersion 36
        versionName = System.getenv("APP_SDK_BUILD_VERSION") ?: "1.0.0"
        versionCode = System.getenv("APP_SDK_BUILD_NUMBER") == null
        ? 1
        : Integer.parseInt(System.getenv("APP_SDK_BUILD_NUMBER"))
    }

    flavorDimensions "app"
    productFlavors {
        appFlavors.each { flavorName, flavor ->
            create(flavorName) {
                dimension "app"
                resValue "string", "app_name", flavor.appName
                buildConfigField "String", "JS_MAIN_MODULE", "\"${flavor.entryFile - ~/\.js$/}\""
            }
        }
        all { flavor ->
            firebaseAppDistribution {
                appId = "1:805028679903:android:594d3964ea5373ea24d96a"
                artifactType = "APK"
                artifactPath = rootProject.file("./app/build/outputs/apk/${flavor.name}/release/app-${flavor.name}-release.apk").path
                serviceCredentialsFile = rootProject.file("./app/fb-distribution-service-credentials.json").path
                testers = [
                    "cvitaman@gmail.com",
                    "4ot.testing@gmail.com",
                    "julia.schindel@ihreapotheken.de",
                    "lorenathiel2@gmail.com",
                ].join(", ")
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file(rootProject.file("./app/" + (keystoreProps['storeFile'] ?: 'demo.jks')).path)
            storePassword keystoreProps['storePassword'] ?: 'Password1!'
            keyAlias keystoreProps['keyAlias'] ?: 'demo'
            keyPassword keystoreProps['keyPassword'] ?: 'Password1!'
        }
    }
    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// The showcase has the module set of the NativeScript plugin's demo: core (with Apofinder and appointments), ordering,
// pharmacy and prescription. It leaves out the native SDK libraries of over-the-counter and CardLink, with everything
// only they bring in, so its size is that of an app integrating just those modules. Their React Native packages stay
// linked, as autolinking links every package of package.json into all variants, but they're thin wrappers without
// the SDK code, and the showcase's JavaScript never loads them (example/index.js).
configurations.matching { it.name.startsWith("showcase") }.configureEach {
    exclude group: "de.ihreapotheken.sdk", module: "otc"
    exclude group: "de.ihreapotheken.sdk", module: "cardlink"
}

repositories {
  mavenCentral()
  google()
  gradlePluginPortal()
  maven {
      url uri("https://api.mapbox.com/downloads/v2/releases/maven")
  }
  maven {
      url uri("https://nexus.link4.health/repository/link4health-anonymous/")
  }
  // The link4health SDK releases the CardLink dependencies here; the
  // anonymous repo above no longer serves current versions.
  maven {
      url uri("https://nexus.link4.health/repository/link4health-releases/")
  }
  maven {
      url uri("https://maven.pkg.github.com/ihreapotheken/IA-SDK-Android")
      credentials {
          it.username = System.getenv("GITHUB_USERNAME") ?: "appsdk-service@4ofthem.eu"
          it.password = System.getenv("GITHUB_TOKEN") ?: ("github_pat_" +
                        new String(Base64.getDecoder().decode(
                                "ZFg4OHliZ0tONlQyTkZCWVhQb1NvbndhcEJXVUxMTllXTkdHYmtGNVNEMDltdThMMlBEdUhKTDVmWWNfQ2tYQ3gwa0sydGNUMElEWUlWMkIxMQ==",
                        )).reverse())
      }
  }
  mavenLocal()
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Memory leak detection (only runs in debug builds)
    debugImplementation("com.squareup.leakcanary:leakcanary-android:2.14")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
