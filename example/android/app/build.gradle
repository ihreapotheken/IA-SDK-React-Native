      credentials {
          it.username = System.getenv("GITHUB_USERNAME") ?: "appsdk-service@4ofthem.eu"
          it.password = System.getenv("GITHUB_TOKEN") ?: ("github_pat_" +
                        new String(Base64.getDecoder().decode(
                                "ZFg4OHliZ0tONlQyTkZCWVhQb1NvbndhcEJXVUxMTllXTkdHYmtGNVNEMDltdThMMlBEdUhKTDVmWWNfQ2tYQ3gwa0sydGNUMElEWUlWMkIxMQ==",
                        )).reverse())
      }
